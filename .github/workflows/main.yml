name: Main
on:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  changesets:
    name: Changesets
    needs: verify
    # The version PR is opened with a short-lived GitHub App token minted via
    # the github-sts action (authorized by .github/sts/changesets.sts.yaml);
    # the built-in GITHUB_TOKEN is not allowed to create pull requests.
    # contents: write stays so branch and tag pushes through the persisted
    # checkout credentials keep working.
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Fetch GitHub token via STS
        id: sts
        uses: tempoxyz/gh-actions/actions/github-sts@183a02178c660ce295e9a262edc5857cb7135f06 # main
        with:
          policy: changesets
      - uses: changesets/action@06245a4e0a36c064a573d4150030f5ec548e4fcc
        with:
          title: 'chore: version packages'
          commit: 'chore: version packages'
          version: bun run changeset:version
          publish: bun run changeset:publish
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ steps.sts.outputs.token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

